# tokaDiscordLink 設定檔
# 欄位名稱與舊的 one 插件相同，舊設定可以直接把 token、頻道 ID、狀態與提示文字複製過來。
# 修改後需要重開伺服器（或停用再啟用插件）才會套用。
# 本檔不要用會洗掉註解的方式改寫；請直接編輯文字。

# 語言。目前提供 zh-TW（繁體中文）。插件的訊息放在 jar 內的 lang/zh-TW.yml；
# 想改個別文字，把同名檔放進 plugins/tokaDiscordLink/lang/，只寫要覆蓋的項目即可。
language: zh-TW

# 設定檔格式版本，請不要修改
config-version: 1

# 機器人令牌（Token）。留空代表停用串聯，不會嘗試連線。
# 令牌等同密碼，請不要貼到聊天室、截圖或提交到 Git。
# 填法：到 Discord Developer Portal 的 Bot 頁面取得令牌，用雙引號包起來貼在這裡。
# 同時請在該頁面開啟 Message Content Intent，否則機器人連不上。
token: ""

# 遊戲聊天串聯的頻道 ID（文字頻道）。聊天訊息與 Discord 指令都在這個頻道。
# 填法：Discord 開啟開發者模式後，對頻道按右鍵「複製頻道 ID」，是一串數字，用雙引號包起來。
# 留空代表停用串聯。
msg-channel-id: ""

# 指令結果頻道 ID（文字頻道），格式同上。留空代表不使用。
cmd-channel-id: ""

# 機器人的狀態文字（顯示成「正在玩…」）。可填任意文字，留空則不顯示。
status: ""

# Discord 指令的前綴。以這個前綴開頭的訊息會變成指令事件，其餘當成聊天。
# 可填任意字元或文字（例如 "/" 或 "!"），留空代表不使用 Discord 指令。
discord-command-prefix: "/"

# 沒有任何插件處理某個 Discord 指令時的回覆（可自訂，支援 Discord 的 Markdown）。
# %name 會換成發話者名稱，%msg 會換成整段指令。
unknown-command-msg: "`%name`不明的指令:%msg。請確認該指令是否存在,以及您是否具備使用該指令的權限。"

# 開服提示：機器人連線成功時送到聊天頻道的嵌入訊息文字（可用 Discord 的 Markdown），留空則不送。
# 顏色用 #RRGGBB 格式（例如 "#00EB00"），格式不對時用預設的淺灰色。
bot-start-msg: "**與伺服器連接成功**"
bot-start-color: "#00EB00"

# 關服提示：插件停用時送到聊天頻道的嵌入訊息，填法同上。
bot-stop-msg: "**與伺服器斷開連接**"
bot-stop-color: "#FFA500"

# ---------------------------------------------------------------- 帳號綁定

# 綁定資料的儲存方式：sqlite（預設）、json、yaml。
# 資料放在 plugins/tokaDiscordLink/storage/<方式>/（舊版的 links 資料夾會自動複製過去，原資料夾保留）。
# 更換方式不會自動搬移既有資料，請在已有綁定資料時不要隨意修改。
storage:
  backend: sqlite

link:
  # 綁定代碼多久失效（秒），一個代碼只能用一次
  code-ttl-seconds: 600
  # 同一個人連續輸入錯誤幾次就暫時鎖住
  max-attempts: 5
  # 鎖住多久（秒）
  lockout-seconds: 600

# ---------------------------------------------------------------- Discord 暱稱

nickname:
  # off：不管暱稱
  # set：綁定成功後把暱稱改成遊戲名稱（預設）；之後玩家上線與定期同步時也會更新
  # enforce：同上，並且在對方自己改掉暱稱後，下次他發言時立刻改回來
  # 機器人需要「管理暱稱」權限，而且它的角色要比對方的最高角色高；伺服器擁有者的暱稱改不了。
  mode: set
  # 暱稱的格式，{name} 是遊戲名稱，最長 32 字元
  format: "{name}"

# ---------------------------------------------------------------- Discord 身分組

# 遊戲裡的權限群組 -> Discord 身分組 ID。單向：只從遊戲同步到 Discord，只會動這裡列出的身分組。
# 權限串接還在等待新的權限組，所以預設是空的，空的時候不會更動任何身分組。
# 範例：
#   admin: "123456789012345678"
roles: {}

# 暱稱與身分組的定期同步間隔（秒），至少 60
sync-interval-seconds: 300
# 沒有可同步的內容（無綁定帳號，或暱稱與身分組都不管理）時改用的間隔（秒），不會小於上一項
sync-interval-idle-seconds: 1800
